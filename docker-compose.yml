services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/site:ro
    working_dir: /site
    command:
      - /bin/sh
      - -c
      - |
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;
          root /site;
          index index.html;
          autoindex off;

          location / {
            try_files $$uri $$uri/ /index.html;
          }
        }
        EOF
        nginx -g 'daemon off;'
