<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Iraady</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/v2/admin/admin.css">
</head>
<body class="ad">
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <a class="brand" href="/v2"><svg class="mark" width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 22c8-6 14 0 20 8 4 6 10 8 16 9" stroke="#2E3192"/><path d="M12 6c4 10 12 22 28 33" stroke="#29ABE2"/><path d="M24 9c2 10 6 20 16 30" stroke="#F2C811"/><path d="M33 14c1 9 3 17 7 25" stroke="#1E9E4A"/></svg><span class="brand-name">Iraady</span><span class="brand-sub mono">Dashboard</span></a>
      <h1>Sign in</h1>
      <p class="muted">Enquiries, orders and every word on iraady.com.</p>
      <div id="loginError" class="alert hidden" role="alert"></div>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="side" id="side" aria-label="Dashboard">
      <a class="brand side-brand" href="#overview"><svg class="mark" width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 22c8-6 14 0 20 8 4 6 10 8 16 9" stroke="#2E3192"/><path d="M12 6c4 10 12 22 28 33" stroke="#29ABE2"/><path d="M24 9c2 10 6 20 16 30" stroke="#F2C811"/><path d="M33 14c1 9 3 17 7 25" stroke="#1E9E4A"/></svg><span class="brand-name">Iraady</span><span class="brand-sub mono">Dashboard</span></a>
      <nav id="sideNav"></nav>
      <div class="side-foot"><span class="who mono" id="who"></span><button class="btn btn-ghost btn-sm" id="logout" type="button">Sign out</button></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <p class="crumb mono" id="crumb"></p>
        <div class="top-right">
          <a class="btn btn-ghost btn-sm hide-sm" href="/v2" target="_blank" rel="noopener">View v2 ↗</a>
          <a class="btn btn-ghost btn-sm hide-sm" href="/" target="_blank" rel="noopener">View live site ↗</a>
          <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch light or dark theme">
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/v2/admin/admin.js"></script>
</body>
</html>
