<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard, Iraady</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>try{if(localStorage.getItem('iraady-v3-admin-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="preload" href="/v3/fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/v3/fonts/anybody-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/v3/admin/admin.css">
</head>
<body class="ad">
  <div id="login" class="login hidden">
    <div class="login-art" aria-hidden="true">
      <p class="login-quote">Run iraady.com from one place.</p>
      <p class="login-meta">Enquiries, orders, products and every word on the site.</p>
    </div>
    <form class="login-card" id="loginForm">
      <a class="brand" href="/v3"><svg class="mark" width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 22c8-6 14 0 20 8 4 6 10 8 16 9" stroke="#2E3192"/><path d="M12 6c4 10 12 22 28 33" stroke="#29ABE2"/><path d="M24 9c2 10 6 20 16 30" stroke="#F2C811"/><path d="M33 14c1 9 3 17 7 25" stroke="#1E9E4A"/></svg><span>Iraady</span><span class="brand-sub">Dashboard</span></a>
      <h1 class="serif">Sign in</h1>
      <div id="loginError" class="alert hidden" role="alert"></div>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      <p class="muted small">Use the same account as the other dashboards.</p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="side" id="side" aria-label="Dashboard">
      <div class="side-top">
        <a class="brand side-brand" href="#overview"><svg class="mark" width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 22c8-6 14 0 20 8 4 6 10 8 16 9" stroke="#2E3192"/><path d="M12 6c4 10 12 22 28 33" stroke="#29ABE2"/><path d="M24 9c2 10 6 20 16 30" stroke="#F2C811"/><path d="M33 14c1 9 3 17 7 25" stroke="#1E9E4A"/></svg><span class="label">Iraady</span></a>
        <button type="button" class="icon-btn collapse" id="collapseBtn" aria-label="Collapse sidebar" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      </div>
      <nav id="sideNav"></nav>
      <div class="side-foot"><span class="who mono" id="who"></span><button class="btn btn-ghost btn-sm" id="logout" type="button">Sign out</button></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <p class="crumb mono" id="crumb"></p>
        <button type="button" class="cmd-btn" id="cmdBtn" aria-label="Open command palette"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search or jump to…</span><kbd class="mono">Ctrl K</kbd></button>
        <div class="top-right">
          <a class="btn btn-ghost btn-sm hide-sm" href="/v3" target="_blank" rel="noopener">View v3 ↗</a>
          <button type="button" class="icon-btn" data-v3-theme aria-label="Switch light or dark theme">
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/v3/admin/admin.js"></script>
</body>
</html>
